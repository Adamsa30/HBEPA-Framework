# HBEPA Suite Continuous Integration & Quality Assurance Workflow Specification
# Target Platform: GitHub Actions Automated Container Runner
# Purpose: Orchestrates regression validations, schema audits, and performance sweeps.

name: "HBEPA Core Suite Integration Audit"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  infrastructure-audit:
    name: "Core Codebase Security & Integrity Audit"
    runs-on: ubuntu-latest

    services:
      # 1. Provision an isolated PostgreSQL container network node
      postgres-sandbox:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: hbepa_sandbox
          POSTGRES_USER: hbepa_audit_user
          POSTGRES_PASSWORD: SecureSandboxPassword123!
        ports:
          - 5432:5432
        # Hold container execution loops until active database socket binds successfully
        options: >-
          --health-cmd "pg_isready -U hbepa_audit_user -d hbepa_sandbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 2. Checkout codebase workspace files down into the runner directory 
      - name: "Checkout Code Repository"
        uses: actions/checkout@v4

      # 3. Initialize target Python runtime configuration parameters
      - name: "Set up Python Environment (v3.10)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4. Inject mandatory driver prerequisites and testing runtimes
      - name: "Install System Package Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests pytest

      # 5. Execute relational storage layout schema and rule migrations
      - name: "Initialize PostgreSQL Ledger Tables"
        env:
          PGPASSWORD: SecureSandboxPassword123!
        run: |
          psql -h localhost -U hbepa_audit_user -d hbepa_sandbox -f database_schema.sql

      # 6. Fire unit testing profiles to verify checks, defaults, and rules
      - name: "Execute Relational Constraint Verification Suite (Pytest)"
        run: |
          pytest test_database_constraints.py -v

      # 7. Launch mock data gateways to audit clinical data-stripping pipelines
      - name: "Execute Integration Pipeline Verification Suite"
        run: |
          python -m unittest test_integration_pipeline.py -v

      # 8. Trigger concurrent load testing utilities to verify latency baselines
      - name: "Execute Infrastructure Performance Latency Sweep"
        run: |
          # Spin up the data firewall callback listener server in the background
          python mock_clinical_callback_server.py &
          SERVER_PID=$!
          sleep 1  # Allow proxy connection port bindings to execute cleanly
          
          # Execute the multi-threaded performance testing sweep
          python performance_benchmark.py
          
          # Safely terminate background listener loops
          kill $SERVER_PID

      # 9. Invoke master orchestrator walkthrough to certify full suite compliance
      - name: "Run Complete End-to-End Walkthrough Simulation"
        run: |
          chmod +x simulate_end_to_end_session.sh
          ./simulate_end_to_end_session.sh
